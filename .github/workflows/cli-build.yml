name: CLI build (reusable)

# Build rbctl single-file self-contained cho mọi nền tảng, mỗi RID một artifact "rbctl-<rid>".
# Gọi từ release-cli.yml và npm-cli.yml (workflow_call) để hai nơi phát hành dùng CÙNG cách build.
#
# Runner native cho từng OS: macOS phải build trên macOS để SDK ký ad-hoc apphost
# (Apple Silicon từ chối chạy binary không có chữ ký); linux-arm64 dùng runner ARM để smoke test thật.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version gắn vào binary (rbctl --version), vd 1.12.4'
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  CLI_PROJECT: src/RouterBalancing.Cli/RouterBalancing.Cli.csproj

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64,     runner: windows-latest,   binary: rbctl.exe, smoke: true }
          - { rid: win-arm64,   runner: windows-latest,   binary: rbctl.exe, smoke: false }
          - { rid: linux-x64,   runner: ubuntu-latest,    binary: rbctl,     smoke: true }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm, binary: rbctl,     smoke: true }
          - { rid: osx-x64,     runner: macos-latest,     binary: rbctl,     smoke: false }
          - { rid: osx-arm64,   runner: macos-latest,     binary: rbctl,     smoke: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ inputs.version }}
        run: |
          dotnet publish $env:CLI_PROJECT `
            -c Release `
            -r $env:RID `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:Version=$env:VERSION `
            -o out --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($LASTEXITCODE)" }

      # Smoke test trên đúng nền tảng: --version + một vòng DB thật (EF/SQLite native) và
      # mã hoá API key (DPAPI trên Windows, AES-GCM file khoá trên macOS/Linux).
      - name: Smoke test
        if: matrix.smoke
        shell: pwsh
        env:
          BINARY: out/${{ matrix.binary }}
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'rbctl-smoke/router-balancing.db'
          & $env:BINARY --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed ($LASTEXITCODE)" }
          & $env:BINARY provider add --name Smoke --identifier smoke `
            --base-url https://smoke.example/v1 --api-key sk-smoke --db $db
          if ($LASTEXITCODE -ne 0) { throw "provider add failed ($LASTEXITCODE)" }
          $accounts = & $env:BINARY account list smoke --json --db $db | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $accounts[0].hasKey) { throw 'account list không thấy key đã mã hoá' }
          & $env:BINARY status --db $db
          # status trả 1 vì không có proxy chạy trên runner — chỉ cần lệnh chạy được tới cuối;
          # reset để runner không lấy exit code này làm kết quả step
          $global:LASTEXITCODE = 0
          Write-Host 'Smoke test OK'

      # TODO(HKStudio011): pin SHA như các action khác khi review
      - uses: actions/upload-artifact@v4
        with:
          name: rbctl-${{ matrix.rid }}
          path: out/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
