name: Build Release Server

# Phát hành rb-server (proxy headless cho Linux) kèm release, tách khỏi release.yml / release-cli.yml.
# Asset là FILE BINARY TRẦN (không .zip) — giống rbctl, để auto-update của app không chọn nhầm.
permissions:
  contents: read

on:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  SERVER_PROJECT: src/RouterBalancing.Server/RouterBalancing.Server.csproj

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-x64,   runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"; echo "label=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "label=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ${{ matrix.rid }}
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          dotnet publish "$SERVER_PROJECT" -c Release -r "$RID" --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none -p:Version="$VERSION" -o out --nologo

      # Smoke test: DB tạm, chờ "LISTENING <port>" rồi gọi /health (không cần API key)
      - name: Smoke test
        run: |
          set -euo pipefail
          DB="$RUNNER_TEMP/rbs/router-balancing.db"
          ./out/rb-server --version
          ./out/rb-server --db "$DB" > "$RUNNER_TEMP/rbs.log" 2>&1 &
          PID=$!
          for i in $(seq 60); do grep -q '^LISTENING ' "$RUNNER_TEMP/rbs.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/rbs.log"
          PORT=$(grep -oE '^LISTENING [0-9]+' "$RUNNER_TEMP/rbs.log" | awk '{print $2}')
          curl -fsS "http://127.0.0.1:$PORT/health"; echo
          kill -TERM "$PID"; wait "$PID" || true
          echo 'Smoke test OK'

      - name: Rename with version
        env:
          RID: ${{ matrix.rid }}
          LABEL: ${{ steps.v.outputs.label }}
        run: |
          mkdir dist
          cp out/rb-server "dist/rb-server-$LABEL-$RID"
          chmod +x "dist/rb-server-$LABEL-$RID"

      # TODO(HKStudio011): pin SHA như các action khác khi review
      - uses: actions/upload-artifact@v4
        with:
          name: rb-server-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # TODO(HKStudio011): pin SHA như các action khác khi review
      - uses: actions/download-artifact@v4
        with:
          pattern: rb-server-*
          path: dist
          merge-multiple: true
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum rb-server-* > SHA256SUMS-server.txt && cat SHA256SUMS-server.txt)
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
