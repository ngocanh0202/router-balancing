name: Build Release CLI

# Phát hành rbctl cho mọi nền tảng kèm release của app, tách khỏi release.yml.
# Asset là FILE BINARY TRẦN (không .zip): GitHubAppUpdateService chọn asset .zip ĐẦU TIÊN của
# release để auto-update app — thêm zip CLI có thể làm updater tải nhầm và fail-closed.
permissions:
  contents: read

on:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  CLI_TEST_PROJECT: tests/RouterBalancing.Cli.Tests/RouterBalancing.Cli.Tests.csproj

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"; echo "label=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "label=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Không phát hành CLI hỏng: test trước khi build các nền tảng
      - run: dotnet test ${{ env.CLI_TEST_PROJECT }} -c Release --no-banner

  build:
    needs: [ version, test ]
    uses: ./.github/workflows/cli-build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  upload:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # gh release upload
      id-token: write     # attest-build-provenance
      attestations: write # attest-build-provenance
    steps:
      # TODO(HKStudio011): pin SHA như các action khác khi review
      - uses: actions/download-artifact@v4
        with:
          pattern: rbctl-*
          path: artifacts

      # artifacts/rbctl-<rid>/rbctl[.exe] → dist/rbctl-<label>-<rid>[.exe]; artifact không giữ bit
      # thực thi nên chmod lại cho bản macOS/Linux.
      - name: Rename with version
        env:
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          set -euo pipefail
          mkdir dist
          for dir in artifacts/rbctl-*; do
            rid="${dir#artifacts/rbctl-}"
            if [ -f "$dir/rbctl.exe" ]; then
              cp "$dir/rbctl.exe" "dist/rbctl-$LABEL-$rid.exe"
            else
              cp "$dir/rbctl" "dist/rbctl-$LABEL-$rid"
              chmod +x "dist/rbctl-$LABEL-$rid"
            fi
          done
          # Tên riêng: release.yml upload SHA256SUMS.txt với --clobber — trùng tên sẽ ghi đè nhau
          (cd dist && sha256sum rbctl-* > SHA256SUMS-cli.txt && cat SHA256SUMS-cli.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/rbctl-*

      # workflow_dispatch không có tag release → chỉ giữ artifact của run để tải thử
      # TODO(HKStudio011): pin SHA như các action khác khi review
      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: rbctl-all-platforms
          path: dist/

      - name: Upload Release Asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
