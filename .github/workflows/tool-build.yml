name: Tool build (reusable)

# Build single-file self-contained cho 6 nền tảng của MỘT tool (rbtui | rb-server), mỗi RID một
# artifact "<tool>-<rid>". Gọi từ npm-tools.yml. Giống cli-build.yml (rbctl) nhưng theo tham số.
on:
  workflow_call:
    inputs:
      tool:
        description: 'rbtui | rb-server (= AssemblyName)'
        required: true
        type: string
      project:
        description: 'Đường dẫn .csproj'
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: ${{ inputs.tool }} ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64,     runner: windows-latest,   exe: '.exe', smoke: true }
          - { rid: win-arm64,   runner: windows-latest,   exe: '.exe', smoke: false }
          - { rid: linux-x64,   runner: ubuntu-latest,    exe: '',     smoke: true }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm, exe: '',     smoke: true }
          - { rid: osx-x64,     runner: macos-latest,     exe: '',     smoke: false }
          - { rid: osx-arm64,   runner: macos-latest,     exe: '',     smoke: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
        run: |
          dotnet publish $env:PROJECT -c Release -r $env:RID --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:Version=$env:VERSION -o out --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($LASTEXITCODE)" }

      # rbtui cần terminal thật, rb-server chạy mãi → chỉ kiểm tra binary chạy được trên đúng nền tảng
      - name: Smoke test
        if: matrix.smoke
        shell: pwsh
        run: |
          & "out/${{ inputs.tool }}${{ matrix.exe }}" --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed ($LASTEXITCODE)" }

      # TODO(HKStudio011): pin SHA như các action khác khi review
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tool }}-${{ matrix.rid }}
          path: out/${{ inputs.tool }}${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7
