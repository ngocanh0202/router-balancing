name: Build Release TUI

# Phát hành rbtui (giao diện terminal toàn màn hình) kèm release — binary trần linux-x64/arm64.
# Asset là FILE BINARY TRẦN (không .zip) — giống rbctl, để auto-update của app không chọn nhầm.
permissions:
  contents: read

on:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: release-tui-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  SERVER_PROJECT: src/RouterBalancing.Tui/RouterBalancing.Tui.csproj

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-x64,   runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"; echo "label=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "label=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ${{ matrix.rid }}
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          dotnet publish "$SERVER_PROJECT" -c Release -r "$RID" --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none -p:Version="$VERSION" -o out --nologo

      # Smoke test: TUI cần terminal thật → chỉ kiểm tra binary chạy được (--version, --help)
      - name: Smoke test
        run: |
          ./out/rbtui --version
          ./out/rbtui --help

      - name: Rename with version
        env:
          RID: ${{ matrix.rid }}
          LABEL: ${{ steps.v.outputs.label }}
        run: |
          mkdir dist
          cp out/rbtui "dist/rbtui-$LABEL-$RID"
          chmod +x "dist/rbtui-$LABEL-$RID"

      # TODO(HKStudio011): pin SHA như các action khác khi review
      - uses: actions/upload-artifact@v4
        with:
          name: rbtui-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # TODO(HKStudio011): pin SHA như các action khác khi review
      - uses: actions/download-artifact@v4
        with:
          pattern: rbtui-*
          path: dist
          merge-multiple: true
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum rbtui-* > SHA256SUMS-tui.txt && cat SHA256SUMS-tui.txt)
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
